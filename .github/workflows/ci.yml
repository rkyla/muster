name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (no dependencies to resolve)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .

      - name: Unit and integration tests
        run: pytest -q

      - name: CLI smoke
        run: |
          muster --version
          muster doctor
          git init -q smoke && cd smoke
          # `git init -b` needs git >= 2.28; this works on every version we support.
          git symbolic-ref HEAD refs/heads/main
          git config user.email ci@example.com && git config user.name CI
          echo hi > a.txt && git add -A && git commit -qm seed
          git checkout -qb feature/one && echo more >> a.txt && git commit -qam one
          git checkout -q main && echo dirty > b.txt
          muster brief
          muster plan feature/one
          muster touch b.txt

      - name: Validation harness against a constructed repo
        run: python validation/run_validation.py smoke
